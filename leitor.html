<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Beleza Essencial · E-book Interativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--rose:#a64b6e;--deep:#8a3a5a;--soft:#b46484;--pink-border:#ffd6e5;--text:#3e2c3b;--text-soft:#5d4352;--paper:#fffbfd;--bg:#fdf7fa;--fs:1}
html,body{height:100%;overflow:hidden}
body{font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--text);line-height:1.65;position:fixed;inset:0;-webkit-tap-highlight-color:transparent;
background-image:radial-gradient(circle at 12% 18%,rgba(255,214,232,.55),transparent 42%),radial-gradient(circle at 88% 82%,rgba(255,200,222,.45),transparent 45%)}
.cover{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem;overflow:hidden;
background:linear-gradient(160deg,#fff2f8,#fde8f2 50%,#fce3ee);transition:opacity .7s,visibility .7s}
.cover::before{content:'';position:absolute;width:140%;height:140%;top:-20%;left:-20%;background:radial-gradient(circle,rgba(255,200,225,.5),transparent 55%);animation:cf 12s ease-in-out infinite;pointer-events:none}
@keyframes cf{50%{transform:translate(4%,3%) scale(1.08)}}
.cover.hidden{opacity:0;visibility:hidden;pointer-events:none}
.cover-content{position:relative;z-index:2;text-align:center;max-width:520px}
.cover-art{width:min(300px,70vw);margin:0 auto 1.2rem;border-radius:26px;overflow:hidden;box-shadow:0 24px 50px -22px rgba(190,100,140,.6);border:3px solid #fff}
.cover-art svg{display:block;width:100%;height:auto}
.badge{display:inline-block;background:rgba(255,255,255,.75);border:1px solid var(--pink-border);color:var(--soft);font-size:.72rem;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;padding:.5rem 1.3rem;border-radius:50px;margin-bottom:1.2rem}
.cover h1{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(2.8rem,10vw,4.4rem);line-height:1;color:var(--rose);letter-spacing:-1.5px;margin-bottom:.8rem}
.cover h1 em{font-weight:400;color:var(--soft)}
.cover-sub{font-weight:600;color:var(--text-soft);margin-bottom:1.6rem}
.cover-btn{font:inherit;font-weight:700;letter-spacing:.8px;color:#fff;background:linear-gradient(135deg,#c4638a,#a64b6e);border:none;padding:1rem 2.6rem;border-radius:50px;cursor:pointer;box-shadow:0 12px 28px -8px rgba(180,80,120,.55);transition:transform .25s}
.cover-btn:hover{transform:translateY(-3px)}
.app{width:100%;height:100%;display:flex;flex-direction:column;padding:max(.8rem,env(safe-area-inset-top)) .9rem max(.4rem,env(safe-area-inset-bottom));opacity:0;transition:opacity .6s .2s}
.app.visible{opacity:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;max-width:960px;width:100%;margin:0 auto;padding:.3rem .4rem .7rem;flex-shrink:0}
.brand{font-family:'Playfair Display',serif;font-weight:600;font-size:1.1rem;color:var(--rose)}.brand span{font-style:italic;font-weight:400;color:var(--soft)}
.tools{display:flex;gap:.4rem;align-items:center}
.chip{font:inherit;font-size:.74rem;font-weight:700;letter-spacing:1px;color:var(--soft);background:rgba(255,255,255,.8);padding:.38rem .85rem;border-radius:50px;border:1px solid var(--pink-border);cursor:pointer}
.chip b{color:var(--rose)}
.stage{flex:1;position:relative;max-width:960px;width:100%;margin:0 auto;min-height:0;perspective:2400px;touch-action:pan-y}
.page{position:absolute;inset:0;border-radius:22px;background:var(--paper);overflow-y:auto;overflow-x:hidden;padding:0 0 2.4rem;transform-origin:left center;backface-visibility:hidden;
background-image:linear-gradient(180deg,rgba(255,245,250,.7),transparent 30%);box-shadow:0 26px 55px -24px rgba(190,100,140,.4),0 0 0 1px rgba(255,220,235,.8) inset;scrollbar-width:thin;scrollbar-color:#f3c4d6 transparent}
.page.in-next{animation:inNext .7s ease both;z-index:5}
.page.out-next{animation:outNext .75s cubic-bezier(.65,.05,.35,1) both;z-index:20;pointer-events:none}
.page.in-prev{animation:inPrev .75s cubic-bezier(.65,.05,.35,1) both;z-index:20}
.page.out-prev{animation:outPrev .7s ease both;z-index:5;pointer-events:none}
@keyframes inNext{from{opacity:.4;transform:scale(.98)}to{opacity:1;transform:none}}
@keyframes outNext{to{transform:rotateY(-100deg);opacity:0}}
@keyframes inPrev{from{transform:rotateY(-100deg);opacity:0}to{transform:none;opacity:1}}
@keyframes outPrev{to{opacity:.4;transform:scale(.98)}}
@media(prefers-reduced-motion:reduce){.page{animation-duration:.01s!important}}
.art{width:100%;aspect-ratio:400/240;max-height:42vh;overflow:hidden;border-radius:22px 22px 0 0;background:#ffe9f1}
.art svg,.art img{display:block;width:100%;height:100%;object-fit:cover}
.inner{padding:1.4rem 1.7rem 0;font-size:calc(1rem*var(--fs))}
@media(min-width:900px){.inner{padding:1.8rem 3rem 0}}
.num{font-size:.68rem;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#d095b0;display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem}
.num::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#f8cddd,transparent)}
h2{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(1.5rem,4.2vw,2.1rem);line-height:1.18;color:var(--rose);letter-spacing:-.4px;margin-bottom:.9rem;display:flex;gap:.6rem;align-items:flex-start}
h2 .ic{flex-shrink:0}
p{font-size:.97em;color:var(--text-soft);margin-bottom:.9rem;font-weight:500}
p strong,li strong{color:var(--deep);font-weight:700}
ul.tl{list-style:none;margin:.9rem 0 1.1rem}
ul.tl li{position:relative;padding-left:1.6rem;margin-bottom:.6rem;font-size:.94em;color:var(--text-soft);font-weight:500}
ul.tl li::before{content:'✦';position:absolute;left:0;top:.05rem;color:#e79ab8;font-size:.85rem}
.box{border-radius:0 16px 16px 0;padding:.95rem 1.2rem;margin:1.1rem 0}
.box h4{font-size:.76rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:.3rem}
.box p{margin:0;font-size:.93em}
.tip{background:linear-gradient(135deg,#ffeef5,#ffe3ee);border-left:4px solid #e79ab8}.tip h4{color:var(--rose)}.tip p{font-style:italic;color:#6b4356}
.cur{background:linear-gradient(135deg,#f3f0ff,#ebe6ff);border-left:4px solid #a995e6}.cur h4{color:#5b46b0}.cur p{color:#4a3f78}
.warn{background:linear-gradient(135deg,#fff4e0,#ffeacc);border-left:4px solid #f0a64b}.warn h4{color:#a8620f}.warn p{color:#6b4a1f}
.rec{background:#f1faf1;border:1.5px dashed #9fcf9f;border-radius:18px;padding:1.1rem 1.2rem;margin:1.1rem 0}
.rec h4{font-family:'Playfair Display',serif;font-size:1.1rem;color:#2f6b3a;margin-bottom:.5rem}
.rec h5{font-size:.72rem;letter-spacing:1.2px;text-transform:uppercase;color:#4a8a55;margin:.7rem 0 .25rem}
.rec ul,.rec ol{padding-left:1.2rem}.rec li{font-size:.92em;color:#3d5a42;margin-bottom:.25rem;font-weight:500}
.rec .av{margin-top:.7rem;font-size:.85em;color:#7a4a2a;font-weight:600}
.toc a{display:flex;gap:.7rem;padding:.55rem .8rem;border-radius:12px;text-decoration:none;color:var(--text-soft);font-weight:600;font-size:.92em;cursor:pointer}
.toc a:hover{background:#ffeef5}.toc a span{color:#d095b0;font-weight:700;min-width:1.7rem}
.bar{display:flex;align-items:center;gap:.8rem;max-width:700px;width:100%;margin:0 auto;padding:.8rem .4rem .5rem;flex-shrink:0}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--pink-border);background:rgba(255,255,255,.9);color:var(--rose);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 5px 16px -6px rgba(200,120,155,.4)}
.nav:disabled{opacity:.3;cursor:default}
.track{flex:1;height:6px;border-radius:10px;background:rgba(255,214,229,.7);overflow:hidden}
.fill{height:100%;width:2%;background:linear-gradient(90deg,#e79ab8,#a64b6e);border-radius:10px;transition:width .5s}
.hint{position:fixed;bottom:4.6rem;left:50%;transform:translateX(-50%);background:rgba(62,44,59,.85);color:#fff;font-size:.78rem;font-weight:600;padding:.5rem 1.2rem;border-radius:50px;pointer-events:none;opacity:0;transition:opacity .5s;z-index:50;white-space:nowrap}
.hint.show{opacity:1}
@media(max-height:500px) and (orientation:landscape){.art{max-height:30vh}.inner{padding:.8rem 1.2rem 0}}
</style>
</head>
<body>

<div class="cover" id="cover">
  <div class="cover-content">
    <div class="cover-art" id="coverArt"></div>
    <div class="badge" id="badge">E-book interativo</div>
    <h1>Beleza<br><em>essencial</em></h1>
    <p class="cover-sub">cuidados para o rosto feminino · com receitas caseiras seguras</p>
    <button class="cover-btn" id="startBtn">Começar a leitura</button>
  </div>
</div>

<div class="app" id="app">
  <div class="top">
    <div class="brand">Beleza <span>essencial</span></div>
    <div class="tools">
      <button class="chip" id="fsBtn" aria-label="Aumentar letra">A+</button>
      <button class="chip" id="tocBtn" aria-label="Sumário">☰</button>
      <div class="chip"><b id="cur">1</b> / <span id="tot">45</span></div>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="bar">
    <button class="nav" id="prev" aria-label="Página anterior">←</button>
    <div class="track"><div class="fill" id="fill"></div></div>
    <button class="nav" id="next" aria-label="Próxima página">→</button>
  </div>
</div>
<div class="hint" id="hint">← arraste para virar a página →</div>

<script src="config.js"></script>
<script>
/* ============================================================
   ILUSTRAÇÕES (SVG originais, geradas por código — sem dependência externa)
   Para usar FOTOS reais, preencha PHOTOS com { 'numero-da-pagina': 'URL da foto licenciada' }.
   ============================================================ */
const PHOTOS = {}; // ex.: { 4: 'https://.../foto.jpg' }
const SKIN=['#f2c9a5','#e0a97d','#b97a56','#8a5a3c','#f6d7bf','#d99a6c'];
const HAIR=['#3b2a22','#1f1a1a','#8a4b2a','#c28a4a','#5a3a2e','#2b1e3a'];
const CLOTH=['#f7b6cf','#c9b6f2','#b6e0d4','#ffd9a8','#f4a9a8','#b9d3f5'];
const BGS=[['#ffe3ee','#fff4f8'],['#e9f5e3','#fbfff7'],['#fff0dc','#fffaf2'],['#e8e4ff','#faf8ff'],['#dff3f7','#f7fdff'],['#ffe6e0','#fff8f6']];
function art(v,k){
  k=k|0;const s=SKIN[k%6],h=HAIR[(k*5+1)%6],c=CLOTH[(k*3)%6],bg=BGS[k%6];
  const bun=k%3===0;
  let deco=`<circle cx="50" cy="45" r="60" fill="#fff" opacity=".35"/><circle cx="360" cy="200" r="80" fill="#fff" opacity=".3"/>
  <g fill="#8fc48f" opacity=".55"><ellipse cx="46" cy="190" rx="14" ry="38" transform="rotate(-25 46 190)"/><ellipse cx="72" cy="205" rx="12" ry="32" transform="rotate(15 72 205)"/><ellipse cx="356" cy="52" rx="12" ry="32" transform="rotate(30 356 52)"/><ellipse cx="378" cy="82" rx="10" ry="26" transform="rotate(-10 378 82)"/></g>
  <g fill="#f7a8c6" opacity=".8"><circle cx="30" cy="120" r="7"/><circle cx="40" cy="128" r="7"/><circle cx="26" cy="132" r="7"/><circle cx="35" cy="125" r="4" fill="#ffd36b"/></g>`;
  const hairBack=bun?`<circle cx="200" cy="42" r="24" fill="${h}"/><path d="M142 108Q140 48 200 46Q260 48 258 108Z" fill="${h}"/>`
    :`<path d="M136 114Q134 38 200 36Q266 38 264 114L274 218Q200 236 126 218Z" fill="${h}"/>`;
  let eyes=`<ellipse cx="184" cy="108" rx="5" ry="3.6" fill="#33262a"/><ellipse cx="216" cy="108" rx="5" ry="3.6" fill="#33262a"/>`;
  const closed=`<path d="M177 108q7 6 14 0M209 108q7 6 14 0" stroke="#33262a" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  let mouth=`<path d="M190 138Q200 147 210 138" stroke="#a0455e" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  let props='';
  switch(v){
    case 'mask': eyes=closed;
      props=`<path d="M156 92Q200 78 244 92Q252 132 232 154Q200 172 168 154Q148 132 156 92Z" fill="#9db88a" opacity=".94"/>${closed}<path d="M189 140q11 7 22 0" stroke="#f3c4d6" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M148 84Q148 34 200 32Q252 34 252 84Q200 62 148 84Z" fill="#fff" stroke="#f3c4d6"/><path d="M160 74Q200 54 240 74" stroke="#f3c4d6" stroke-width="3" fill="none"/>`;break;
    case 'cucumber': eyes='';
      props=`<g><circle cx="184" cy="108" r="14" fill="#b7d98b" stroke="#6fa24a" stroke-width="2"/><circle cx="184" cy="108" r="8" fill="none" stroke="#e6f4c8" stroke-width="2"/><circle cx="216" cy="108" r="14" fill="#b7d98b" stroke="#6fa24a" stroke-width="2"/><circle cx="216" cy="108" r="8" fill="none" stroke="#e6f4c8" stroke-width="2"/></g>
      <path d="M148 84Q148 34 200 32Q252 34 252 84Q200 62 148 84Z" fill="#fff" stroke="#f3c4d6"/><g fill="#fff"><circle cx="300" cy="170" r="22" fill="#b7d98b" stroke="#6fa24a" stroke-width="2"/><circle cx="300" cy="170" r="13" fill="none" stroke="#e6f4c8" stroke-width="2"/></g>`;break;
    case 'cream': eyes=closed;
      props=`<g fill="#fff" opacity=".95"><circle cx="174" cy="126" r="6"/><circle cx="226" cy="126" r="6"/><circle cx="200" cy="90" r="5"/><circle cx="200" cy="122" r="4"/></g>
      <rect x="292" y="172" width="64" height="40" rx="9" fill="#fff" stroke="#e79ab8" stroke-width="2"/><rect x="288" y="160" width="72" height="16" rx="7" fill="#e79ab8"/><path d="M305 192h38" stroke="#f3c4d6" stroke-width="4" stroke-linecap="round"/>`;break;
    case 'guasha': eyes=closed;
      props=`<g transform="translate(232 124) rotate(-28)"><path d="M0 0Q20-18 42-4Q52 12 32 24Q10 30 0 0Z" fill="#f0a8c4" stroke="#d46a95" stroke-width="2"/></g>
      <rect x="62" y="150" width="30" height="62" rx="8" fill="#ffe9a8" stroke="#e0b84a" stroke-width="2"/><rect x="68" y="140" width="18" height="14" rx="3" fill="#3b2a22"/>`;break;
    case 'sun': eyes=`<path d="M177 108q7 -5 14 0M209 108q7 -5 14 0" stroke="#33262a" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
      props=`<g fill="#fff"><circle cx="176" cy="126" r="5"/><circle cx="224" cy="126" r="5"/><circle cx="200" cy="90" r="5"/><circle cx="200" cy="124" r="4"/></g>
      <g transform="translate(332 52)"><circle r="22" fill="#ffd36b"/><g stroke="#ffd36b" stroke-width="4" stroke-linecap="round"><path d="M0-34v-10M0 34v10M-34 0h-10M34 0h10M24-24l7-7M-24 24l-7 7M24 24l7 7M-24-24l-7-7"/></g></g>
      <g transform="translate(70 160) rotate(-10)"><rect width="34" height="62" rx="9" fill="#ffd36b" stroke="#e0a030" stroke-width="2"/><rect x="6" y="-10" width="22" height="12" rx="3" fill="#fff" stroke="#e0a030" stroke-width="2"/><text x="17" y="38" font-size="11" font-weight="700" text-anchor="middle" fill="#a8620f" font-family="sans-serif">SPF</text></g>`;break;
    case 'tea': eyes=closed;
      props=`<path d="M292 176h58l-6 34q-3 10-14 10h-18q-11 0-14-10Z" fill="#fff" stroke="#e79ab8" stroke-width="2"/><path d="M350 184q18 2 12 18q-4 8-16 8" stroke="#e79ab8" stroke-width="3" fill="none"/><path d="M304 168q-6-10 0-18t0-16M324 168q-6-10 0-18t0-16" stroke="#cfa" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
      <ellipse cx="68" cy="190" rx="16" ry="30" fill="#8fc48f" transform="rotate(25 68 190)"/>`;break;
    case 'sleep': eyes=closed;
      props=`<path d="M150 86Q200 68 250 86" stroke="#e79ab8" stroke-width="11" fill="none" stroke-linecap="round"/><path d="M60 40a20 20 0 1 0 24 26a16 16 0 1 1-24-26Z" fill="#ffd36b"/><g fill="#ffd36b"><circle cx="110" cy="30" r="3"/><circle cx="330" cy="46" r="3"/><circle cx="350" cy="90" r="2.5"/></g>
      <ellipse cx="200" cy="232" rx="150" ry="22" fill="#fff" opacity=".85"/>`;break;
    case 'serum': eyes=closed;
      props=`<g fill="#7fd0d8" opacity=".95"><path d="M174 118q-5 9 0 12q5-3 0-12Z"/></g><rect x="296" y="150" width="50" height="62" rx="10" fill="#ffe9a8" stroke="#e0b84a" stroke-width="2"/><rect x="308" y="128" width="26" height="24" rx="5" fill="#3b2a22"/><ellipse cx="321" cy="120" rx="9" ry="12" fill="#3b2a22"/><circle cx="321" cy="182" r="10" fill="#fff" opacity=".7"/>`;break;
    case 'lips': mouth=`<path d="M184 138Q192 130 200 135Q208 130 216 138Q208 152 200 152Q192 152 184 138Z" fill="#d6456f"/><path d="M184 138Q200 141 216 138" stroke="#a02c4f" stroke-width="1.6" fill="none"/><circle cx="208" cy="138" r="1.8" fill="#fff" opacity=".8"/>`;
      props=`<g transform="translate(300 150)"><rect x="0" y="22" width="30" height="46" rx="5" fill="#e79ab8"/><rect x="4" y="2" width="22" height="26" rx="6" fill="#ffd9e6" stroke="#e79ab8" stroke-width="2"/></g><g fill="#ffd36b"><path d="M330 60l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/></g>`;break;
    case 'mirror': props=`<g transform="translate(312 112) rotate(20)"><circle r="36" fill="#fff" stroke="#e79ab8" stroke-width="5"/><circle r="28" fill="#eaf6ff"/><path d="M-14-10q8-12 22-8" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="-6" y="38" width="12" height="44" rx="6" fill="#e79ab8"/></g>`;break;
    case 'towel': eyes=closed;
      props=`<path d="M148 86Q146 30 200 28Q254 30 252 86Q200 64 148 86Z" fill="#fff" stroke="#f3c4d6" stroke-width="2"/><path d="M160 74Q200 52 240 74M168 54Q200 40 232 54" stroke="#f3c4d6" stroke-width="3" fill="none"/>
      <g fill="#fff" opacity=".95"><circle cx="176" cy="128" r="5"/><circle cx="224" cy="128" r="5"/></g>`;break;
    case 'yoga': eyes=closed; mouth=`<path d="M188 138Q200 150 212 138" stroke="#a0455e" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
      props=`<g fill="${s}" stroke="#00000020"><ellipse cx="158" cy="168" rx="12" ry="20" transform="rotate(-20 158 168)"/><ellipse cx="242" cy="168" rx="12" ry="20" transform="rotate(20 242 168)"/></g><g fill="#ffd36b"><path d="M330 56l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/></g>`;break;
    case 'food': eyes=closed;
      props=`<g transform="translate(296 168)"><circle cx="16" cy="22" r="18" fill="#e5586a"/><circle cx="46" cy="28" r="18" fill="#f08a3c"/><path d="M16 6q4-8 12-6" stroke="#4a8a55" stroke-width="3" fill="none"/><ellipse cx="34" cy="52" rx="26" ry="9" fill="#8fc48f"/></g>`;break;
    default: eyes=closed; // leaves
  }
  return `<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração: mulher cuidando da pele">
  <defs><linearGradient id="g${k}${v}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bg[0]}"/><stop offset="1" stop-color="${bg[1]}"/></linearGradient></defs>
  <rect width="400" height="240" fill="url(#g${k}${v})"/>${deco}${hairBack}
  <path d="M104 240Q112 192 184 188L216 188Q288 192 296 240Z" fill="${c}"/><path d="M184 188Q200 206 216 188" fill="${s}"/>
  <rect x="184" y="150" width="32" height="44" fill="${s}"/><rect x="184" y="150" width="32" height="14" fill="#000" opacity=".08"/>
  <circle cx="154" cy="112" r="8" fill="${s}"/><circle cx="246" cy="112" r="8" fill="${s}"/>
  <ellipse cx="200" cy="108" rx="46" ry="56" fill="${s}"/>
  <path d="M152 106Q150 56 200 54Q250 56 248 106Q236 76 200 74Q164 76 152 106Z" fill="${h}"/>
  ${eyes}<path d="M176 98q8-5 16-1M208 97q8-4 16 1" stroke="${h}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M200 112q-4 12 2 15" stroke="#00000030" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="172" cy="126" r="7" fill="#ff8fb0" opacity=".28"/><circle cx="228" cy="126" r="7" fill="#ff8fb0" opacity=".28"/>
  ${mouth}${props}</svg>`;
}

/* ============================================================
   CONTEÚDO
   campos: i=ícone, t=título, a=ilustração, b=parágrafos, l=lista, tip=[título,texto], cur=curiosidade,
           warn=[título,texto], rec={n,ing,pre,av}
   ============================================================ */
let P=[],TITLES=[],FULL=false;

/* ============================================================
   LEITOR
   ============================================================ */
const $=id=>document.getElementById(id);
const stage=$('stage');let N=0;
let cur=0,busy=false,started=false,fs=1;
$('coverArt').innerHTML=art('mask',0);

function pageHTML(i){
  const d=P[i];
  const img=PHOTOS[i+1]?`<img src="${PHOTOS[i+1]}" alt="Mulher cuidando da pele" loading="lazy">`:art(d.a||'leaves',i);
  let h=`<div class="art">${img}</div><div class="inner"><div class="num">${d.lock?'conteúdo bloqueado':'página '+String(i+1).padStart(2,'0')+' · de '+(TITLES.length||N)}</div><h2><span class="ic">${d.i}</span><span>${d.t}</span></h2>`;
  if(d.toc){
    h+='<div class="toc">'+TITLES.map((p,j)=>{if(j===i)return '';const open=j<P.length&&!P[j].lock;return `<a data-go="${open?j:P.length-1}"><span>${j+1}</span>${p.t}${open?'':' 🔒'}</a>`}).join('')+'</div>';
  }else if(d.lock){
    h+='<p>Você leu a amostra gratuita. As outras páginas trazem as rotinas completas, os ativos explicados, 14 receitas caseiras seguras e o plano de 30 dias.</p><p><a class="cover-btn" style="display:inline-block;text-decoration:none" href="index.html#buy">Desbloquear o e-book completo</a></p><p><button class="chip" id="paidBtn" style="margin-top:.4rem">Já paguei — verificar meu pagamento</button></p><p id="lockMsg" style="font-weight:700"></p>';
  }else{
    (d.b||[]).forEach(x=>h+=`<p>${x}</p>`);
    if(d.l)h+='<ul class="tl">'+d.l.map(x=>`<li>${x}</li>`).join('')+'</ul>';
    if(d.rec){
      const isList=d.rec.n.indexOf('ABCDE')>-1;
      h+=`<div class="rec"><h4>🧪 ${isList?'Guia rápido':'Receita caseira'}: ${d.rec.n}</h4><h5>${isList?'Os sinais':'Ingredientes'}</h5><ul>${d.rec.ing.map(x=>`<li>${x}</li>`).join('')}</ul><h5>${isList?'O que fazer':'Modo de fazer'}</h5><ol>${d.rec.pre.map(x=>`<li>${x}</li>`).join('')}</ol><p class="av">⚠️ ${d.rec.av}</p></div>`;
    }
    if(d.tip)h+=`<div class="box tip"><h4>${d.tip[0]}</h4><p>${d.tip[1]}</p></div>`;
    if(d.cur)h+=`<div class="box cur"><h4>💡 Você sabia?</h4><p>${d.cur}</p></div>`;
    if(d.warn)h+=`<div class="box warn"><h4>⚠️ ${d.warn[0]}</h4><p>${d.warn[1]}</p></div>`;
  }
  return h+'</div>';
}
function mount(i,cls){
  const el=document.createElement('div');el.className='page '+(cls||'');el.innerHTML=pageHTML(i);
  const pb=el.querySelector('#paidBtn');if(pb)pb.addEventListener('click',()=>loadFull($('lockMsg')));
  el.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',()=>goTo(+a.dataset.go)));
  stage.appendChild(el);return el;
}
function ui(){
  $('cur').textContent=cur+1;$('tot').textContent=TITLES.length||N;$('fill').style.width=((cur+1)/N*100)+'%';
  $('prev').disabled=cur===0;$('next').disabled=cur===N-1;
  if(FULL)try{localStorage.setItem('be_page',String(cur))}catch(e){}
}
function goTo(n){
  if(busy||n<0||n>=N||n===cur)return;
  busy=true;const fwd=n>cur;
  const old=stage.querySelector('.page:last-child');
  const nw=mount(n,fwd?'in-next':'in-prev');
  if(old)old.classList.add(fwd?'out-next':'out-prev');
  cur=n;ui();
  setTimeout(()=>{stage.querySelectorAll('.page').forEach(p=>{if(p!==nw)p.remove()});nw.className='page';nw.scrollTop=0;busy=false},780);
}
const next=()=>goTo(cur+1),prev=()=>goTo(cur-1);
$('next').addEventListener('click',next);$('prev').addEventListener('click',prev);
$('tocBtn').addEventListener('click',()=>goTo(1));
$('fsBtn').addEventListener('click',()=>{fs=fs>=1.3?1:fs+.15;document.documentElement.style.setProperty('--fs',fs);$('fsBtn').textContent=fs>=1.3?'A−':'A+'});

/* gestos: só vira a página em arrasto horizontal claro (não atrapalha a rolagem) */
let sx=0,sy=0,tracking=false;
stage.addEventListener('touchstart',e=>{if(!started)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true},{passive:true});
stage.addEventListener('touchend',e=>{
  if(!tracking)return;tracking=false;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6){dx<0?next():prev()}
},{passive:true});
document.addEventListener('keydown',e=>{
  if(!started){if(e.key==='Enter')$('startBtn').click();return}
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next()}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
});

$('startBtn').addEventListener('click',()=>{
  $('cover').classList.add('hidden');$('app').classList.add('visible');started=true;
  if(FULL)try{const s=parseInt(localStorage.getItem('be_page'),10);if(s>0&&s<N)cur=s}catch(e){}
  mount(cur);ui();
  setTimeout(()=>$('hint').classList.add('show'),700);setTimeout(()=>$('hint').classList.remove('show'),5000);
});

/* ============================================================
   CARREGAMENTO: amostra grátis (arquivos do repositório) + conteúdo completo (API, com token do pagamento)
   ============================================================ */
const API=(window.CONFIG&&window.CONFIG.API||'').replace(/\/$/,'');
const LOCK={i:'🔒',t:'Continue lendo',a:'cream',lock:true};
const sb=$('startBtn');sb.disabled=true;sb.textContent='Carregando…';
function setPages(pages,full){
  P=pages;FULL=full;N=P.length;
  $('badge').textContent='E-book interativo · '+(TITLES.length||N)+' páginas'+(full?'':' · amostra grátis');
  ui();
}
async function loadFull(msgEl){
  const say=t=>{if(msgEl)msgEl.textContent=t};
  let tok=null,order=null;try{tok=localStorage.getItem('be_token');order=localStorage.getItem('be_order')}catch(e){}
  const q=new URLSearchParams(location.search).get('pedido');if(q)order=q;
  try{
    if(order){say('Verificando pagamento…');
      const r=await fetch(API+'/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:order})});
      const j=await r.json();
      if(j.state==='paid'&&j.token){tok=j.token;try{localStorage.setItem('be_token',tok);localStorage.setItem('be_order',order)}catch(e){}}
      else if(j.state==='limit'){say(j.error||'Limite de acessos atingido.');return false}
      else if(!tok){say(j.state==='pending'?'Pagamento ainda não confirmado. Tente de novo em instantes.':'Não encontramos pagamento aprovado.');return false}
    }
    if(!tok){say('Nenhum pagamento encontrado neste aparelho.');return false}
    const r=await fetch(API+'/api/content',{headers:{Authorization:'Bearer '+tok}});
    if(!r.ok){try{localStorage.removeItem('be_token')}catch(e){}say('Acesso expirado ou inválido.');return false}
    const j=await r.json();
    TITLES=j.pages.map(p=>({t:p.t,i:p.i}));
    const keep=Math.min(cur,j.pages.length-1);
    setPages(j.pages,true);
    if(started){stage.innerHTML='';cur=keep;mount(cur);ui()}
    return true;
  }catch(e){say('Erro de conexão com o servidor.');return false}
}
(async function init(){
  try{
    const pv=await (await fetch('data/preview.json',{cache:'no-cache'})).json();
    TITLES=pv.titles;setPages(pv.pages.concat([LOCK]),false);
  }catch(e){sb.textContent='Erro ao carregar';return}
  let hasTok=false;try{hasTok=!!(localStorage.getItem('be_token')||localStorage.getItem('be_order'))}catch(e){}
  if(hasTok||new URLSearchParams(location.search).get('pedido'))await loadFull(null);
  sb.disabled=false;sb.textContent='Começar a leitura';
})();
</script>
</body>
